# Codemagic CI for the Yaadly Android app.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
# This file sits at the repo root, so no `working_directory` is needed.

workflows:
  android-release:
    name: Android release APK
    instance_type: mac_mini_m2 # the only machine on Codemagic's free plan
    max_build_duration: 45
    environment:
      flutter: 3.47.8
      java: 17
      vars:
        API_BASE_URL: https://yaadley-api.mshiraz.com
      # Keystore uploaded in Team settings → codemagic.yaml settings → Code signing identities →
      # Android keystores, reference name below (see SETUP.md §3).
      android_signing:
        - yaadly_keystore
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate code (only if build_runner is used)
        script: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
      - name: Static analysis
        script: flutter analyze
      - name: Tests
        script: flutter test
      - name: Build release APK
        script: |
          flutter build apk --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - dev.mshiraz@gmail.com # TODO: replace with your email
        notify:
          success: true
          failure: true
